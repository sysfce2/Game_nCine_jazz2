name: 'Libretro'

on:
  push:
    branches:
      - 'master'
  pull_request:
    types: [ opened, synchronize ]
  workflow_dispatch:

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Build:
    strategy:
      fail-fast: false
      matrix:
        include:
        # Both cores are built for each architecture: the "Software" one presents the CPU rasterizer's
        # framebuffer through `retro_video_refresh` and runs on any frontend, the "OpenGL" one renders on the
        # GPU into the frontend's FBO obtained through `SET_HW_RENDER` and requires OpenGL|ES 3.0. They are
        # the only two rendering backends the libretro API can present (see `NCINE_BUILD_LIBRETRO` in
        # "cmake/ncine_options.cmake"), and both end up as the same "jazz2_libretro.so", so each one gets an
        # artifact of its own.
        - BuildType: Release
          Platform: x64
          RHI: Software
          Runner: 'ubuntu-22.04'

        - BuildType: Release
          Platform: x64
          RHI: OpenGL
          Runner: 'ubuntu-22.04'

        - BuildType: Release
          Platform: aarch64
          RHI: Software
          Runner: 'ubuntu-22.04-arm'

        - BuildType: Release
          Platform: aarch64
          RHI: OpenGL
          Runner: 'ubuntu-22.04-arm'

    runs-on: ${{ matrix.Runner }}

    steps:
    - name: 'Checkout Repository'
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: 'Create Build Environment'
      run: |
        sudo apt-get update -y
        # No window backend is compiled for the core (the frontend owns the window and the input devices), so
        # none of GLFW/SDL2/GLEW is installed here. `Libs/Linux/` carries prebuilt libraries for x86_64 only,
        # which is why the aarch64 runner needs every dependency from the system anyway - one list covers both.
        # `libvorbis-dev` rather than the runtime `libvorbisfile3`: "cmake/FindVorbis.cmake" looks for the
        # unversioned ".so" symlinks, and without them Ogg Vorbis support is silently left out of the build.
        # `libdw-dev` (elfutils) is what makes the crash reports readable: without it Backward falls back to
        # `backtrace_symbols()`, which resolves addresses through the dynamic symbol table only - and since
        # everything is compiled with `-fvisibility=hidden`, that yields bare addresses and no function names.
        sudo apt-get install -y cmake curl g++ libopenal-dev libvorbis-dev libopenmpt-dev libcurl4-openssl-dev libdw-dev zlib1g-dev

    - if: matrix.RHI == 'OpenGL'
      name: 'Install OpenGL|ES'
      run: |
        # The ES profile links libGLESv2 and libEGL (see `OpenGLES2::GLES2` in "cmake/ncine_extra_sources.cmake").
        # These are the libglvnd development packages, which the mesa-named "libgles2-mesa-dev" has been just a
        # transitional wrapper for since 22.04.
        sudo apt-get install -y libgles-dev libegl-dev

    - name: 'Configure CMake'
      run: |
        rm -f ./Content/Translations/*.po

        # `DEATH_DEBUG_SYMBOLS` splits the debug info off into "jazz2_libretro.pdb" and links the stripped core
        # back to it through its ".gnu_debuglink" section, the same way the other Linux workflows do it for the
        # executable. The shipped core stays small, but its crash reports still have function names.
        cmake -B ./_build/ -D CMAKE_BUILD_TYPE=${{ matrix.BuildType }} -D DEATH_DEBUG_SYMBOLS=ON -D NCINE_BUILD_LIBRETRO=ON -D NCINE_PREFERRED_RHI=${{ matrix.RHI }} -D WITH_WEBSOCKET=OFF

    - name: 'Build'
      run: |
        make -j $(nproc) -C ./_build/

    - name: 'Smoke Test'
      run: |
        # Nothing forbids undefined symbols in a shared library, so an incomplete link only shows up when the
        # frontend actually loads the core. `ctypes.CDLL()` is a `dlopen()` with RTLD_NOW, the same way
        # RetroArch loads it, and `retro_api_version()` proves the libretro entry points are exported.
        python3 -c "
        import ctypes
        core = ctypes.CDLL('./_build/jazz2_libretro.so')
        core.retro_api_version.restype = ctypes.c_uint
        version = core.retro_api_version()
        print('retro_api_version() =', version)
        assert version == 1, 'Unexpected libretro API version'
        "

    - name: 'Create Package'
      run: |
        mkdir ./_package/
        cp -f ./_build/jazz2_libretro.so ./_package/jazz2_libretro.so
        # The split debug symbols, referenced by name from the core's ".gnu_debuglink" section, so this has to
        # stay next to it and keep its file name
        cp -f ./_build/jazz2_libretro.pdb ./_package/jazz2_libretro.pdb
        # The frontend looks for the game content next to the core (or in "‹System›/jazz2/"), see README.md
        cp -f -r ./Content/ ./_package/Content/
        cp -f ./LICENSE ./_package/LICENSE

    - name: 'Upload Package'
      uses: actions/upload-artifact@v7
      with:
        name: Jazz2_Libretro_Linux_${{ matrix.Platform }}_${{ matrix.RHI }}
        path: ./_package/
